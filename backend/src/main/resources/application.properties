spring.application.name=matriculas

# Permite definir as variáveis em um arquivo backend/.env (não versionado)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# MongoDB Atlas: informe a connection string em MONGODB_URI
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/matriculas}
spring.mongodb.database=${MONGODB_DATABASE:matriculas}

# Autenticação (JWT assinado com HS256). Em produção, defina um JWT_SECRET próprio.
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-com-32+chars}
app.jwt.expiracao-minutos=${JWT_EXPIRATION_MINUTES:480}

# Origens autorizadas a chamar a API (front-end React + Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
