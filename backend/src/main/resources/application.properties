spring.application.name=matriculas

# Permite definir as variáveis em um arquivo backend/.env (não versionado)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# MongoDB Atlas: informe a connection string em MONGODB_URI
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/matriculas}
spring.mongodb.database=${MONGODB_DATABASE:matriculas}
